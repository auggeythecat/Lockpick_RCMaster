 
name: Auto Build, Tag and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install native build tools (gcc/make/zip)
        run: |
          apt-get update
          apt-get install -y build-essential git zip

      - name: Compute release tag from Versions.inc
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --tags --force

          # The embedded build version (shown in-app) is the single source of truth,
          # so the release tag is derived from it to keep tag and binary in sync.
          major="$(sed -n 's/^LPVERSION_MAJOR := *\([0-9]\+\).*$/\1/p' Versions.inc | head -n1)"
          minor="$(sed -n 's/^LPVERSION_MINOR := *\([0-9]\+\).*$/\1/p' Versions.inc | head -n1)"
          bugfx="$(sed -n 's/^LPVERSION_BUGFX := *\([0-9]\+\).*$/\1/p' Versions.inc | head -n1)"
          if [[ -z "${major}" || -z "${minor}" || -z "${bugfx}" ]]; then
            echo "Failed to parse Versions.inc" >&2
            exit 1
          fi

          # Preserve the repository's existing tag style (v-prefixed if any v* tag exists).
          if [[ -n "$(git tag --list 'v*')" ]]; then
            prefix="v"
          else
            prefix=""
          fi

          tag="${prefix}${major}.${minor}.${bugfx}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          # Skip releasing when this version was already tagged (bump Versions.inc to cut a new release).
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${tag} already exists; release steps will be skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Computed new tag: ${tag}"
          fi

      - name: Build the project
        if: steps.version.outputs.exists == 'false'
        run: make

      - name: Create ZIP package
        if: steps.version.outputs.exists == 'false'
        run: |
          version="${{ steps.version.outputs.tag }}"
          cd output
          zip -r "../Lockpick_RCM-${version}.zip" .
          cd ..

      - name: Create and push tag
        if: steps.version.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists; skipping tag creation."
          else
            git tag "${tag}"
            git push origin "refs/tags/${tag}"
          fi

      - name: Get latest commit message
        if: steps.version.outputs.exists == 'false'
        id: changelog
        run: |
          message=$(git log -1 --pretty=%B)
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$message" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            Changelog:

            ${{ steps.changelog.outputs.message }}
          files: |
            output/Lockpick_RCM.bin
            output/Lockpick_RCM_unc.bin
            Lockpick_RCM-${{ steps.version.outputs.tag }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload compiled ZIP as artifact
        if: steps.version.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: Lockpick_RCM-${{ steps.version.outputs.tag }}.zip
          path: Lockpick_RCM-${{ steps.version.outputs.tag }}.zip
